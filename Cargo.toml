[package]
name          = "tsec"
version       = "3.0.0"
edition       = "2021"
rust-version  = "1.82"
description   = "TSEC — Tactical Security Enumeration & Compromise Framework"
license       = "MIT"
readme        = "README.md"
keywords      = ["security", "recon", "pentest", "framework", "tsec"]
categories    = ["command-line-utilities"]

[[bin]]
name = "tsec"
path = "src/main.rs"

[dependencies]
tokio          = { version = "1", features = ["rt-multi-thread", "process", "time", "sync", "io-util", "signal"] }
crossterm      = "0.27"
dialoguer      = { version = "0.11", features = ["history"] }
clap           = { version = "4", features = ["derive"] }
anyhow         = "1"
thiserror      = "1"
serde          = { version = "1", features = ["derive"] }
serde_json     = "1"
toml           = "0.8"
chrono         = { version = "0.4", features = ["serde"] }
regex          = "1"
unicode-width  = "0.1"
libc           = "0.2"

[profile.release]
opt-level     = 3
lto           = true
codegen-units = 1
strip         = true
panic         = "unwind"

[profile.test]
opt-level = 1
