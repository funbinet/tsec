network = true
[[capability.provider]]
binary = 'zgrab2'
[[capability.provider.operation]]
name = 'HTTP Grab'
args = ['http', '-f', '{target}', '-p', '80']
output = 'lines'
network = true

[[capability.provider.operation]]
name = 'TLS Grab'
args = ['tls', '-f', '{target}', '-p', '443']
output = 'lines'
network = true

[[capability.provider]]
binary = "ss"
[[capability.provider.operation]]
name = "Local Listeners"
args = ["-lntup"]
output = "lines"
network = false
[[capability.provider]]
binary = "curl"
[[capability.provider.operation]]
name = "HTTP Service Headers"
args = ["-sS", "-I", "http://{target}"]
output = "lines"
network = true
[[capability]]
id = 'surface.host-discovery'
phase = 'surface'
label = 'HOST DISCOVERY'
summary = 'Find live hosts on a network using ICMP, ARP and TCP probes'
inputs = [
  { key = 'target', type = 'target', required = true },
  { key = 'interface', type = 'interface', required = false },
]
[[capability.provider]]
binary = 'nmap'
