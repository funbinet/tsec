  { key = 'domain', type = 'domain', required = true },
  { key = 'limit', type = 'integer', required = false, default = '200' },
]
[[capability.provider]]
binary = 'theharvester'
[[capability.provider.operation]]
name = 'Bing Harvest'
args = ['-d', '{domain}', '-b', 'duckduckgo', '-l', '{limit}']
output = 'lines'
network = true
[[capability.provider.operation]]
name = 'Certificate Harvest'
args = ['-d', '{domain}', '-b', 'crtsh', '-l', '{limit}']
output = 'lines'
network = true
[[capability.provider.operation]]
name = 'DuckDuckGo Harvest'
args = ['-d', '{domain}', '-b', 'duckduckgo', '-l', '{limit}']
output = 'lines'
network = true
[[capability.provider.operation]]
name = 'Yahoo Harvest'
args = ['-d', '{domain}', '-b', 'yahoo', '-l', '{limit}']
output = 'lines'
network = true
[[capability.provider.operation]]
name = 'Baidu Harvest'
args = ['-d', '{domain}', '-b', 'baidu', '-l', '{limit}']
output = 'lines'
network = true
[[capability.provider.operation]]
name = 'All Source Harvest'
args = ['-d', '{domain}', '-b', 'all', '-l', '{limit}']
output = 'lines'
network = true
[[capability.provider]]
binary = 'theharvester'
[[capability.provider.operation]]
name = 'Email Intel'
args = ['-d', '{domain}', '-b', 'all', '-l', '{limit}']
output = 'lines'
network = true
[[capability.provider]]
binary = 'dig'
[[capability.provider.operation]]
name = 'Mail Exchange'
args = ['+short', '{domain}', 'MX']
output = 'lines'
network = true
[[capability.provider.operation]]
name = 'TXT SPF Records'
args = ['+short', '{domain}', 'TXT']
output = 'lines'
network = true
[[capability.provider]]
binary = 'host'
[[capability.provider.operation]]
name = 'MX Lookup'
args = ['-t', 'mx', '{domain}']
output = 'lines'
network = true
[[capability.provider]]
binary = 'dnsrecon'
[[capability.provider.operation]]
name = 'Mail Record Enum'
args = ['-d', '{domain}', '-t', 'std']
output = 'lines'
network = true
[[capability.provider]]
binary = 'curl'
[[capability.provider.operation]]
name = 'CRTSH Email Dump'
args = ['--max-time', '30', '-s', 'https://crt.sh/?q=%25.{domain}&output=json']
output = 'json'
network = true
[[capability.provider.operation]]
name = 'Whois API Pull'
args = ['--max-time', '30', '-s', 'https://api.hackertarget.com/whois/?q={domain}']
output = 'lines'
network = true
[[capability.provider]]
binary = 'dnsx'
[[capability.provider.operation]]
name = 'Mail Server Sweep'
args = ['-d', '{domain}', '-w', '{wl:dns/subdomains-5000.txt}', '-mx', '-resp', '-silent']
output = 'lines'
network = true
[[capability.provider]]
binary = 'whois'
[[capability.provider.operation]]
name = 'Registrant Mail Pull'
args = ['{domain}']
output = 'lines'
network = true

[[capability]]
