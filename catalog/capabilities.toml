[[capability]]
id = 'recon.cloud-exposure'
phase = 'recon'
label = 'CLOUD EXPOSURE'
summary = 'Enumerate public cloud storage and hosting assets of a domain'
inputs = [
  { key = 'domain', type = 'domain', required = true },
  { key = 'keyword', type = 'text', required = false },
]
[[capability.provider]]
binary = 'cloud_enum'
[[capability.provider.operation]]
name = 'Multi Cloud Enum'
args = ['-k', '{domain}']
output = 'lines'
network = true
[[capability.provider.operation]]
name = 'Keyword Enum'
args = ['-k', '{keyword}']
output = 'lines'
network = true
[[capability.provider]]
binary = 'cloudbrute'
[[capability.provider.operation]]
name = 'Bucket Brute'
args = ['-d', '{domain}', '-k', '{keyword}']
output = 'lines'
network = true
[[capability.provider]]
binary = 'aws'
[[capability.provider.operation]]
name = 'Bucket Listing'
args = ['s3', 'ls', 's3://{keyword}', '--no-sign-request']
output = 'lines'
network = true
[[capability.provider.operation]]
name = 'Object Listing'
args = ['s3api', 'list-objects-v2', '--bucket', '{keyword}', '--no-sign-request']
