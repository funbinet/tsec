network = true

[[capability.provider.operation]]
name = 'Domain Search'
args = ['domain', '{domain}']
output = 'lines'
network = true
[[capability.provider]]
binary = 'spiderfoot'
[[capability.provider.operation]]
name = 'Automated Scan'
args = ['-s', '{domain}', '-o', 'csv']
output = 'lines'
network = true
[[capability.provider]]
binary = 'recon-ng'
[[capability.provider.operation]]
name = 'Workspace Recon'
args = ['-w', '{domain}']
output = 'lines'
network = true

[[capability.provider]]
binary = "curl"
[[capability.provider.operation]]
name = "Public Header Review"
args = ["-sS", "-I", "https://{domain}"]
output = "lines"
network = true
[[capability.provider]]
binary = "dig"
[[capability.provider.operation]]
name = "Public DNS Context"
args = ["+short", "{domain}", "A"]
output = "lines"
network = true
[[capability]]
id = 'recon.infra-profiling'
phase = 'recon'
label = 'INFRA PROFILING'
summary = 'Profile network infrastructure: ports, CDN status and HTTP surface'
inputs = [
  { key = 'target', type = 'target', required = true },
]
[[capability.provider]]
binary = 'nmap'
[[capability.provider.operation]]
name = 'Aggressive Profile'
args = ['-sV', '-sC', '-O', '-A', '{target}']
output = 'lines'
network = true

[[capability.provider.operation]]
name = 'Banner Grab'
args = ['--script', 'banner', '-p', '1-10000', '{target}']
output = 'lines'
network = true
[[capability.provider]]
binary = 'rustscan'
[[capability.provider.operation]]
name = 'Fast Port Scan'
args = ['-a', '{target}', '--ulimit', '5000', '--', '-sV']
output = 'lines'
network = true
[[capability.provider]]
binary = 'naabu'
[[capability.provider.operation]]
name = 'All Ports'
args = ['-host', '{target}', '-p', '-', '-silent']
output = 'lines'
network = true
[[capability.provider]]
binary = 'cdncheck'
[[capability.provider.operation]]
name = 'CDN Detection'
args = ['-i', '{target}', '-cdn', '-waf', '-cloud']
output = 'lines'
network = true

[[capability]]
id = 'recon.code-leakage'
phase = 'recon'
label = 'CODE LEAKAGE'
summary = 'Detect exposed secrets in repositories and dumped source trees'
inputs = [
  { key = 'path', type = 'path', required = true },
]
[[capability.provider]]
binary = 'gitleaks'
[[capability.provider.operation]]
name = 'Repository Detect'
args = ['detect', '-s', '{path}', '-v']
output = 'lines'
network = true

[[capability.provider.operation]]
name = 'Directory Detect'
args = ['dir', '{path}', '--no-banner']
output = 'lines'
network = true
[[capability.provider]]
binary = 'trufflehog'
[[capability.provider.operation]]
name = 'Filesystem Scan'
args = ['filesystem', '{path}', '--json']
output = 'lines'
network = true

# --------------------------------------------------------------------------
# ATTACK SURFACE
# --------------------------------------------------------------------------

[[capability.provider]]
binary = "git"
[[capability.provider.operation]]
name = "Repository Status"
args = ["-C", "{path}", "status", "--short"]
output = "lines"
network = false

[[capability.provider.operation]]
name = "Tracked Files"
args = ["-C", "{path}", "ls-files"]
output = "lines"
network = false
[[capability.provider]]
binary = "find"
[[capability.provider.operation]]
name = "Repository Artifacts"
args = ["{path}", "-type", "f", "-name", ".gitignore"]
output = "lines"
network = false
