# TSEC capability catalog — the operational surface of TSEC 3.0.
# Copyright (c) funbinet. All rights reserved.
# Part of TSEC terminal cybersecurity operations platform by funbinet.
#
# Ten phases, sixteen capabilities each. Every operation is an explicit
# argument vector with {input} placeholders declared by the capability's
# input schema. Nothing here is executed through a shell; templates that
# carry shell syntax are rejected at load time.
#
# A capability is offered when at least one of its provider binaries
# resolves on the host; otherwise it is reported unavailable, by name.

schema = 1

# ==========================================================================
# PHASE 1 — RECONNAISSANCE
# ==========================================================================

[[capability]]
id = 'recon.subdomain-discovery'
phase = 'recon'
label = 'SUBDOMAIN DISCOVERY'
summary = 'Passive, permutation and brute-force subdomain enumeration across public sources'
inputs = [
  { key = 'domain', type = 'domain', required = true },
]
[[capability.provider]]
binary = 'subfinder'
[[capability.provider.operation]]
name = 'Passive Enumeration'
args = ['-d', '{domain}', '-silent']
output = 'lines'
network = true
[[capability.provider.operation]]
name = 'All Sources'
args = ['-d', '{domain}', '-all', '-silent']
output = 'lines'
network = true
[[capability.provider.operation]]
name = 'Recursive Enumeration'
args = ['-d', '{domain}', '-recursive', '-all', '-silent']
output = 'lines'
network = true
[[capability.provider]]
binary = 'amass'
[[capability.provider.operation]]
name = 'Passive Enum'
args = ['enum', '-passive', '-d', '{domain}', '-silent']
output = 'lines'
network = true
[[capability.provider.operation]]
name = 'Active Enum'
args = ['enum', '-d', '{domain}', '-active', '-silent']
output = 'lines'
network = true
[[capability.provider.operation]]
name = 'Permutation Sweep'
args = ['enum', '-d', '{domain}', '-brute', '-w', '/usr/share/wordlists/amass/subdomains.txt', '-silent']
output = 'lines'
network = true
[[capability.provider]]
binary = 'assetfinder'
[[capability.provider.operation]]
name = 'Subs Only'
args = ['--subs-only', '{domain}']
output = 'lines'
network = true
[[capability.provider.operation]]
name = 'Full Surface'
args = ['{domain}']
output = 'lines'
network = true
[[capability.provider]]
binary = 'findomain'
[[capability.provider.operation]]
name = 'Quiet Resolve'
args = ['-t', '{domain}', '-q']
output = 'lines'
network = true
[[capability.provider]]
binary = 'dnsx'
[[capability.provider.operation]]
name = 'Wordlist Brute'
args = ['-d', '{domain}', '-w', '/usr/share/wordlists/subdomains-top1mil-5000.txt', '-silent']
output = 'lines'
network = true
[[capability.provider]]
binary = 'puredns'
[[capability.provider.operation]]
name = 'Resolving Brute'
args = ['bruteforce', '/usr/share/wordlists/subdomains-top1mil-5000.txt', '{domain}']
output = 'lines'
network = true
[[capability.provider.operation]]
name = 'Permutation Resolve'
args = ['alterate', '{domain}', '--wordlist', '/usr/share/wordlists/subdomains-top1mil-5000.txt']
output = 'lines'
network = true

[[capability]]
id = 'recon.dns-mapping'
phase = 'recon'
label = 'DNS MAPPING'
summary = 'Full record extraction, zone transfer attempts and DNSSEC zone walking'
inputs = [
  { key = 'domain', type = 'domain', required = true },
  { key = 'nameserver', type = 'target', required = false },
]
[[capability.provider]]
binary = 'dig'
[[capability.provider.operation]]
name = 'Any Records'
args = ['{domain}', 'ANY', '+noall', '+answer']
output = 'lines'
network = true
[[capability.provider.operation]]
name = 'Mail Exchange'
args = ['+short', '{domain}', 'MX']
output = 'lines'
network = true
[[capability.provider.operation]]
name = 'Text Records'
args = ['+short', '{domain}', 'TXT']
output = 'lines'
network = true
[[capability.provider.operation]]
name = 'Zone Transfer'
args = ['{domain}', 'AXFR', '@{nameserver}']
output = 'lines'
network = true
[[capability.provider.operation]]
name = 'SOA Fingerprint'
args = ['+short', '{domain}', 'SOA']
output = 'lines'
network = true
[[capability.provider.operation]]
name = 'SPF Extraction'
args = ['+short', '{domain}', 'SPF']
output = 'lines'
network = true
[[capability.provider]]
binary = 'dnsx'
[[capability.provider.operation]]
name = 'Record Sweep'
args = ['-d', '{domain}', '-a', '-mx', '-ns', '-txt', '-cname', '-soa', '-resp', '-json']
output = 'json'
network = true
[[capability.provider.operation]]
name = 'Name Server Cards'
args = ['-d', '{domain}', '-ns', '-resp', '-silent']
output = 'lines'
network = true
[[capability.provider]]
binary = 'dnsrecon'
[[capability.provider.operation]]
name = 'Standard Enum'
args = ['-d', '{domain}', '-t', 'std']
output = 'lines'
network = true
[[capability.provider.operation]]
name = 'Zone Walk'
args = ['-d', '{domain}', '-t', 'zonewalk']
output = 'lines'
network = true
[[capability.provider]]
binary = 'fierce'
[[capability.provider.operation]]
name = 'Recursive DNS Scan'
args = ['--domain', '{domain}']
output = 'lines'
network = true
[[capability.provider]]
binary = 'host'
[[capability.provider.operation]]
name = 'Any Lookup'
args = ['-t', 'any', '{domain}']
output = 'lines'
network = true

