[[capability]]
id = 'recon.certificate-intel'
phase = 'recon'
label = 'CERTIFICATE INTEL'
summary = 'Certificate transparency harvesting and live TLS certificate metadata'
inputs = [
  { key = 'domain', type = 'domain', required = true },
  { key = 'port', type = 'port', required = false, default = '443' },
]
[[capability.provider]]
binary = 'tlsx'
[[capability.provider.operation]]
name = 'SAN Collection'
args = ['-u', '{domain}', '-san', '-cn', '-so', '-silent']
output = 'lines'
network = true
[[capability.provider.operation]]
name = 'Expiry Audit'
args = ['-u', '{domain}', '-expired', '-mismatched', '-self-signed', '-revoked', '-silent']
output = 'lines'
network = true
[[capability.provider.operation]]
name = 'JSON Cert Dump'
args = ['-u', '{domain}', '-san', '-cn', '-json', '-silent']
output = 'json'
network = true
[[capability.provider]]
binary = 'openssl'
[[capability.provider.operation]]
name = 'Certificate Text'
args = ['s_client', '-connect', '{domain}:{port}', '-servername', '{domain}', '-showcerts']
output = 'lines'
network = true
[[capability.provider.operation]]
name = 'Cipher Brief'
args = ['s_client', '-connect', '{domain}:{port}', '-servername', '{domain}', '-brief']
output = 'lines'
network = true
[[capability.provider]]
binary = 'ctfr'
[[capability.provider.operation]]
name = 'CT Subdomains'
args = ['-d', '{domain}']
output = 'lines'
network = true
[[capability.provider]]
binary = 'curl'
[[capability.provider.operation]]
name = 'CRTSH Full Dump'
args = ['-s', 'https://crt.sh/?q={domain}&output=json']
output = 'json'
network = true
[[capability.provider.operation]]
name = 'CRTSH Wildcard Dump'
args = ['-s', 'https://crt.sh/?q=%25.{domain}&output=json']
output = 'json'
network = true
[[capability.provider]]
binary = 'dig'
[[capability.provider.operation]]
name = 'CT Log TXT Check'
args = ['+short', '{domain}', 'TXT']
output = 'lines'
network = true
[[capability.provider]]
binary = 'host'
[[capability.provider.operation]]
name = 'Cert Host Verify'
args = ['-t', 'a', '{domain}']
output = 'lines'
network = true
[[capability.provider]]
binary = 'nmap'
[[capability.provider.operation]]
name = 'TLS Service Script'
args = ['--script', 'ssl-cert', '-p', '{port}', '{domain}']
output = 'lines'
network = true
[[capability.provider]]
binary = 'httpx'
[[capability.provider.operation]]
name = 'JARM Fingerprint'
args = ['-u', '{domain}', '-jarm', '-silent', '-nc']
output = 'lines'
network = true

