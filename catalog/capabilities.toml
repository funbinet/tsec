[[capability.provider]]
binary = 'ssh'
[[capability.provider.operation]]
name = 'Key Reuse Sweep'
args = ['-o', 'BatchMode=yes', '-o', 'StrictHostKeyChecking=no', '{username}@10.0.0.10', 'id']
output = 'lines'
network = true
[[capability.provider]]
binary = 'ssh'
[[capability.provider.operation]]
name = 'Key Teardown'
args = ['-o', 'StrictHostKeyChecking=no', '{username}@{rhost}', 'sed -i "/tsupd/d" ~/.ssh/authorized_keys']
output = 'lines'
network = true

