network = true
[[capability.provider]]
binary = 'curl'
[[capability.provider.operation]]
name = 'S3 Endpoint Probe'
args = ['-s', '-o', '/dev/null', '-w', '%{http_code}', 'https://{keyword}.s3.amazonaws.com']
output = 'lines'
network = true
[[capability.provider.operation]]
name = 'Azure Blob Probe'
args = ['-s', '-o', '/dev/null', '-w', '%{http_code}', 'https://{keyword}.blob.core.windows.net']
output = 'lines'
network = true
[[capability.provider.operation]]
name = 'GCS Bucket Probe'
args = ['-s', '-o', '/dev/null', '-w', '%{http_code}', 'https://{keyword}.storage.googleapis.com']
output = 'lines'
network = true
[[capability.provider]]
binary = 'dig'
[[capability.provider.operation]]
name = 'Cloud CNAME Check'
args = ['+short', '{domain}', 'CNAME']
output = 'lines'
network = true
[[capability.provider]]
binary = 'dnsx'
[[capability.provider.operation]]
name = 'Cloud Target CNAME'
args = ['-d', '{domain}', '-cname', '-resp', '-silent']
output = 'lines'
network = true
[[capability.provider]]
binary = 'httpx'
[[capability.provider.operation]]
name = 'Cloud CDN Detect'
args = ['-u', 'https://{domain}', '-cdn', '-silent', '-nc']
output = 'lines'
network = true
[[capability.provider]]
binary = 'nuclei'
[[capability.provider.operation]]
name = 'Cloud Exposure Templates'
args = ['-u', '{domain}', '-tags', 'cloud,s3,azure,gcp', '-silent', '-nc']
output = 'lines'
network = true

