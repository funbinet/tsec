name = 'Raw Layer Two'
args = ['-c', 'isolation_test.py']
output = 'lines'
network = true

[[capability]]
id = 'wireless.audit-reporting'
phase = 'wireless'
label = 'AUDIT REPORTING'
summary = 'Report wireless findings with cryptographic proof'
inputs = [
  { key = 'hashes', type = 'file', required = false, default = '/tmp/pmkid.22000' },
  { key = 'inventory', type = 'file', required = false, default = '/tmp/inventory.csv' },
  { key = 'report', type = 'file', required = false, default = '/tmp/wireless_report.md' },
]
[[capability.provider]]
binary = 'aircrack-ng'
[[capability.provider.operation]]
name = 'Strength Verify'
args = ['{hashes}']
output = 'lines'
network = true
[[capability.provider]]
binary = 'hashcat'
[[capability.provider.operation]]
name = 'Potfile Show'
args = ['-m', '22000', '--show', '{hashes}']
output = 'lines'
network = false
[[capability.provider]]
binary = 'airdecap-ng'
[[capability.provider.operation]]
name = 'Decrypt Proof'
args = ['-e', '{inventory}', '-p', 'passphrase', 'capture.pcap']
output = 'lines'
network = true
[[capability.provider]]
binary = 'tshark'
[[capability.provider.operation]]
name = 'Cipher Summary'
args = ['-r', 'capture.pcap', '-Y', 'wlan.rsn']
output = 'lines'
network = true
[[capability.provider]]
binary = 'python3'
[[capability.provider.operation]]
name = 'Risk Matrix'
args = ['wireless_report.py', '--inventory', '{inventory}', '--out', '{report}']
output = 'lines'
network = true
