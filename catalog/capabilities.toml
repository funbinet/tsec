# TSEC capability catalog — the operational surface of TSEC 3.0.
# Copyright (c) funbinet. All rights reserved.
# Part of TSEC terminal cybersecurity operations platform by funbinet.
#
# Ten phases, sixteen capabilities each. Every operation is an explicit
# argument vector with {input} placeholders declared by the capability's
# input schema. Nothing here is executed through a shell; templates that
# carry shell syntax are rejected at load time.
#
# A capability is offered when at least one of its provider binaries
# resolves on the host; otherwise it is reported unavailable, by name.

schema = 1

# --------------------------------------------------------------------------
# RECONNAISSANCE
# --------------------------------------------------------------------------

[[capability]]
id = 'recon.subdomain-discovery'
phase = 'recon'
label = 'SUBDOMAIN DISCOVERY'
summary = 'Passive and permutation subdomain enumeration across public sources'
inputs = [
  { key = 'domain', type = 'domain', required = true },
]
[[capability.provider]]
binary = 'subfinder'
[[capability.provider.operation]]
name = 'Passive Enumeration'
args = ['-d', '{domain}', '-silent']
output = 'lines'
network = true

[[capability.provider.operation]]
name = 'All Sources'
args = ['-d', '{domain}', '-all', '-silent']
output = 'lines'
network = true

[[capability.provider.operation]]
name = 'Recursive Enumeration'
args = ['-d', '{domain}', '-recursive', '-all', '-silent']
output = 'lines'
network = true
[[capability.provider]]
binary = 'assetfinder'
[[capability.provider.operation]]
name = 'Subs Only'
args = ['--subs-only', '{domain}']
output = 'lines'
network = true
[[capability.provider]]
binary = 'findomain'
[[capability.provider.operation]]
name = 'Quiet Resolve'
args = ['-t', '{domain}', '-q']
output = 'lines'
network = true

[[capability]]
id = 'recon.dns-mapping'
phase = 'recon'
label = 'DNS MAPPING'
summary = 'Full record extraction, brute force and zone transfer attempts'
inputs = [
  { key = 'domain', type = 'domain', required = true },
  { key = 'nameserver', type = 'target', required = false },
]
[[capability.provider]]
binary = 'dig'
[[capability.provider.operation]]
name = 'Any Records'
args = ['{domain}', 'ANY', '+noall', '+answer']
output = 'lines'
network = true

[[capability.provider.operation]]
name = 'Mail Exchange'
args = ['+short', '{domain}', 'MX']
output = 'lines'
network = true

[[capability.provider.operation]]
name = 'Text Records'
args = ['+short', '{domain}', 'TXT']
output = 'lines'
network = true

[[capability.provider.operation]]
name = 'Zone Transfer'
args = ['{domain}', 'AXFR', '@{nameserver}']
output = 'lines'
network = true

[[capability.provider.operation]]
name = 'Reverse Lookup'
args = ['-x', '{nameserver}', '+short']
output = 'lines'
network = true
[[capability.provider]]
binary = 'dnsx'
[[capability.provider.operation]]
name = 'Record Sweep'
args = ['-d', '{domain}', '-a', '-mx', '-ns', '-txt', '-cname', '-resp']
output = 'lines'
network = true

[[capability.provider.operation]]
name = 'Address Response'
args = ['-d', '{domain}', '-a', '-resp-only', '-silent']
output = 'lines'
network = true
[[capability.provider]]
binary = 'host'
[[capability.provider.operation]]
name = 'Any Lookup'
args = ['-t', 'any', '{domain}']
output = 'lines'
network = true

[[capability]]
id = 'recon.email-harvesting'
phase = 'recon'
label = 'EMAIL HARVESTING'
summary = 'Collect email addresses tied to a domain from public sources'
inputs = [
  { key = 'domain', type = 'domain', required = true },
  { key = 'limit', type = 'integer', required = false, default = '200' },
]
[[capability.provider]]
binary = 'theharvester'
[[capability.provider.operation]]
name = 'All Sources'
args = ['-d', '{domain}', '-b', 'all', '-l', '{limit}']
output = 'lines'
network = true

[[capability.provider.operation]]
name = 'Search Engines'
args = ['-d', '{domain}', '-b', 'bing', '-l', '{limit}']
output = 'lines'
network = true

[[capability.provider.operation]]
name = 'Certificate Sources'
args = ['-d', '{domain}', '-b', 'crtsh', '-l', '{limit}']
output = 'lines'
network = true

[[capability.provider]]
binary = "whois"
[[capability.provider.operation]]
name = "Registrant Contact Review"
args = ["{domain}"]
output = "lines"
network = false
[[capability.provider]]
binary = "dig"
[[capability.provider.operation]]
name = "Mail Hosts"
args = ["+short", "{domain}", "MX"]
output = "lines"
network = true
[[capability]]
id = 'recon.whois-intelligence'
phase = 'recon'
label = 'WHOIS INTELLIGENCE'
summary = 'Registrant, registrar and infrastructure ownership records'
inputs = [
  { key = 'domain', type = 'domain', required = true },
]
[[capability.provider]]
binary = 'whois'
[[capability.provider.operation]]
name = 'Registrant Lookup'
args = ['{domain}']
output = 'lines'
network = true
[[capability.provider]]
binary = 'amass'
[[capability.provider.operation]]
name = 'Reverse Whois'
args = ['intel', '-whois', '-d', '{domain}']
output = 'lines'
network = true

[[capability.provider.operation]]
name = "Passive Intel"
args = ["enum", "-passive", "-d", "{domain}"]
output = "lines"
network = true
[[capability.provider]]
binary = "dig"
[[capability.provider.operation]]
name = "Authoritative NS"
args = ["+short", "{domain}", "NS"]
output = "lines"
network = true

[[capability.provider.operation]]
name = "Mail Routing"
args = ["+short", "{domain}", "MX"]
output = "lines"
network = true
[[capability]]
id = 'recon.certificate-intel'
phase = 'recon'
label = 'CERTIFICATE INTEL'
summary = 'Certificate transparency and TLS certificate metadata collection'
inputs = [
  { key = 'domain', type = 'domain', required = true },
  { key = 'port', type = 'port', required = false, default = '443' },
]
[[capability.provider]]
binary = 'tlsx'
[[capability.provider.operation]]
name = 'SAN Collection'
args = ['-u', '{domain}', '-san', '-cn', '-so', '-silent']
output = 'lines'
network = true

[[capability.provider.operation]]
name = 'Certificate Export'
args = ['-u', '{domain}', '-ce']
output = 'lines'
network = true

[[capability.provider.operation]]
name = 'Expiry Audit'
args = ['-u', '{domain}', '-expired', '-mismatched', '-self-signed']
output = 'lines'
network = true
[[capability.provider]]
binary = 'openssl'
[[capability.provider.operation]]
name = 'Certificate Text'
args = ['s_client', '-connect', '{domain}:{port}', '-servername', '{domain}']
output = 'lines'
network = false

[[capability.provider.operation]]
name = 'Validity Dates'
args = ['s_client', '-connect', '{domain}:{port}', '-showcerts']
output = 'lines'
network = false
[[capability.provider]]
binary = 'ctfr'
[[capability.provider.operation]]
name = 'CT Subdomains'
args = ['-d', '{domain}']
output = 'lines'
network = true

[[capability]]
id = 'recon.asn-mapping'
phase = 'recon'
label = 'ASN MAPPING'
summary = 'Map a domain or organisation to its autonomous systems and prefixes'
inputs = [
  { key = 'domain', type = 'domain', required = true },
]
[[capability.provider]]
binary = 'asnmap'
[[capability.provider.operation]]
name = 'Domain CIDRs'
args = ['-d', '{domain}', '-silent']
output = 'lines'
network = true
[[capability.provider]]
binary = 'amass'
[[capability.provider.operation]]
name = 'Organisation Assets'
args = ['intel', '-d', '{domain}']
output = 'lines'
network = true

[[capability.provider]]
binary = "whois"
[[capability.provider.operation]]
name = "ASN Record"
args = ["{domain}"]
output = "lines"
network = true
[[capability.provider]]
binary = "dig"
[[capability.provider.operation]]
name = "Address Records"
args = ["+short", "{domain}", "A"]
output = "lines"
network = true

[[capability.provider.operation]]
name = "Authority Records"
args = ["+short", "{domain}", "NS"]
output = "lines"
network = true
[[capability]]
id = 'recon.cloud-exposure'
phase = 'recon'
label = 'CLOUD EXPOSURE'
summary = 'Enumerate public cloud storage and hosting assets of a domain'
inputs = [
  { key = 'domain', type = 'domain', required = true },
  { key = 'keyword', type = 'text', required = false },
]
[[capability.provider]]
binary = 'cloud_enum'
[[capability.provider.operation]]
name = 'Multi Cloud Enum'
args = ['-k', '{domain}']
output = 'lines'
network = true
[[capability.provider]]
binary = 'cloudbrute'
[[capability.provider.operation]]
name = 'Bucket Brute'
args = ['-d', '{domain}', '-k', '{keyword}']
output = 'lines'
network = true
[[capability.provider]]
binary = 'aws'
[[capability.provider.operation]]
name = 'Bucket Listing'
args = ['s3', 'ls', 's3://{keyword}', '--no-sign-request']
output = 'lines'
network = true

[[capability.provider.operation]]
name = "Public Bucket Check"
args = ["s3api", "list-buckets", "--no-sign-request"]
output = "lines"
network = true
[[capability.provider]]
binary = "curl"
[[capability.provider.operation]]
name = "Cloud Metadata Header Check"
args = ["-sS", "-I", "https://{domain}"]
output = "lines"
network = true
[[capability]]
id = 'recon.username-discovery'
phase = 'recon'
label = 'USERNAME DISCOVERY'
summary = 'Locate accounts carrying a target username across platforms'
inputs = [
  { key = 'username', type = 'username', required = true },
]
[[capability.provider]]
binary = 'sherlock'
[[capability.provider.operation]]
name = 'Social Hunt'
args = ['{username}']
output = 'lines'
network = true
[[capability.provider]]
binary = 'maigret'
[[capability.provider.operation]]
name = 'Deep Footprint'
args = ['{username}']
output = 'lines'
network = true
[[capability.provider]]
binary = 'socialscan'
[[capability.provider.operation]]
name = 'Availability Check'
args = ['--username', '{username}']
output = 'lines'
network = true

[[capability.provider]]
binary = "curl"
[[capability.provider.operation]]
name = "Profile Reachability"
args = ["-sS", "-I", "https://github.com/{username}"]
output = "lines"
network = true

[[capability.provider.operation]]
name = "Profile Headers"
args = ["-sS", "-I", "https://github.com/{username}"]
output = "lines"
network = true
[[capability]]
id = 'recon.tech-fingerprint'
phase = 'recon'
label = 'TECH FINGERPRINT'
summary = 'Fingerprint web technologies, frameworks and WAF presence'
inputs = [
  { key = 'url', type = 'url', required = true },
]
[[capability.provider]]
binary = 'whatweb'
[[capability.provider.operation]]
name = 'Aggressive Fingerprint'
args = ['-a', '3', '{url}']
output = 'lines'
network = true
[[capability.provider]]
binary = 'webanalyze'
[[capability.provider.operation]]
name = 'Wappalyzer Scan'
args = ['-host', '{url}', '-crawl', '2', '-output', 'json']
output = 'lines'
network = true
[[capability.provider]]
binary = 'wafw00f'
[[capability.provider.operation]]
name = 'WAF Detection'
args = ['{url}', '-v']
output = 'lines'
network = true

[[capability.provider]]
binary = "curl"
[[capability.provider.operation]]
name = "HTTP Headers"
args = ["-sS", "-I", "{url}"]
output = "lines"
network = true

[[capability.provider.operation]]
name = "Response Metadata"
args = ["-sS", "-I", "{url}"]
output = "lines"
network = true
[[capability]]
id = 'recon.web-crawling'
phase = 'recon'
label = 'WEB CRAWLING'
summary = 'Crawl a target and extract linked endpoints and resources'
inputs = [
  { key = 'url', type = 'url', required = true },
  { key = 'depth', type = 'integer', required = false, default = '3' },
]
[[capability.provider]]
binary = 'katana'
[[capability.provider.operation]]
name = 'Standard Crawl'
args = ['-u', '{url}', '-d', '{depth}', '-jc', '-kf']
output = 'lines'
network = true

[[capability.provider.operation]]
name = 'JSON Output'
args = ['-u', '{url}', '-d', '{depth}', '-jc', '-json']
output = 'lines'
network = true

[[capability.provider.operation]]
name = 'Ajax Crawl'
args = ['-u', '{url}', '-d', '{depth}', '-jc', '-aff', '-xhr']
output = 'lines'
network = true
[[capability.provider]]
binary = 'gospider'
[[capability.provider.operation]]
name = 'Fast Spider'
args = ['-s', '{url}', '-d', '{depth}', '-c', '10']
output = 'lines'
network = true
[[capability.provider]]
binary = 'hakrawler'
[[capability.provider.operation]]
name = 'Endpoint Crawl'
args = ['-d', '{depth}', '-plain', '{url}']
output = 'lines'
network = true

[[capability]]
id = 'recon.archive-mining'
phase = 'recon'
label = 'ARCHIVE MINING'
summary = 'Mine historical URL archives for forgotten endpoints and parameters'
inputs = [
  { key = 'domain', type = 'domain', required = true },
]
[[capability.provider]]
binary = 'waybackurls'
[[capability.provider.operation]]
name = 'Historical URLs'
args = ['{domain}']
output = 'lines'
network = true
[[capability.provider]]
binary = 'gau'
[[capability.provider.operation]]
name = 'Aggregated URLs'
args = ['{domain}', '--threads', '10', '--subs']
output = 'lines'
network = true

[[capability.provider.operation]]
name = 'Filtered URLs'
args = ['{domain}', '--blacklist', 'png,jpg,gif,css,woff']
output = 'lines'
network = true
[[capability.provider]]
binary = 'waymore'
[[capability.provider.operation]]
name = 'Archive Responses'
args = ['-i', '{domain}', '-mode', 'U']
output = 'lines'
network = true

[[capability.provider]]
binary = "curl"
[[capability.provider.operation]]
name = "Archive Index"
args = ["-sS", "https://web.archive.org/cdx/search/cdx?url={domain}/*&output=json&fl=original&filter=statuscode:200"]
output = "lines"
network = true
[[capability]]
id = 'recon.metadata-extraction'
phase = 'recon'
label = 'METADATA EXTRACTION'
summary = 'Extract document and image metadata from files or a directory'
inputs = [
  { key = 'path', type = 'path', required = true },
]
[[capability.provider]]
binary = 'exiftool'
[[capability.provider.operation]]
name = 'Full Metadata'
args = ['-a', '-u', '-g1', '{path}']
output = 'lines'
network = false

[[capability.provider.operation]]
name = 'JSON Export'
args = ['-json', '{path}']
output = 'lines'
network = false

[[capability.provider.operation]]
name = 'Recursive Scan'
args = ['-r', '{path}']
output = 'lines'
network = false
[[capability.provider]]
binary = 'mat2'
[[capability.provider.operation]]
name = 'Metadata Show'
args = ['--show', '{path}']
output = 'lines'
network = true
[[capability.provider]]
binary = 'pdfinfo'
[[capability.provider.operation]]
name = 'PDF Metadata'
args = ['{path}']
output = 'lines'
network = true

[[capability]]
id = 'recon.network-mapping'
phase = 'recon'
label = 'NETWORK MAPPING'
summary = 'Discover live hosts and network paths across a range'
inputs = [
  { key = 'target', type = 'target', required = true },
]
[[capability.provider]]
binary = 'nmap'
[[capability.provider.operation]]
name = 'Ping Sweep'
args = ['-sn', '{target}', '-oG', '-']
output = 'lines'
network = true

[[capability.provider.operation]]
name = 'ARP Sweep'
args = ['-sn', '-PR', '{target}']
output = 'lines'
network = true

[[capability.provider.operation]]
name = 'List Targets'
args = ['-sL', '{target}']
output = 'lines'
network = true

[[capability.provider.operation]]
name = 'Trace Route'
args = ['-sn', '--traceroute', '{target}']
output = 'lines'
network = true
[[capability.provider]]
binary = 'masscan'
[[capability.provider.operation]]
name = 'High Speed Sweep'
args = ['{target}', '--ping', '--rate', '100000']
output = 'lines'
network = true
[[capability.provider]]
binary = 'arp-scan'
[[capability.provider.operation]]
name = 'Local ARP'
args = ['-l', '--retry', '3']
output = 'lines'
network = true

[[capability]]
id = 'recon.osint-gathering'
phase = 'recon'
label = 'OSINT GATHERING'
summary = 'Broad open source intelligence collection for a target'
inputs = [
  { key = 'domain', type = 'domain', required = true },
]
[[capability.provider]]
binary = 'shodan'
[[capability.provider.operation]]
name = 'Host Search'
args = ['search', 'hostname:{domain}', '--fields', 'ip_str,port,org,os']
