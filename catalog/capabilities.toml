]
[[capability.provider]]
binary = 'naabu'
[[capability.provider.operation]]
name = 'Top 100 Ports'
args = ['-host', '{target}', '-top-ports', '100', '-silent', '-rate', '{rate}']
output = 'lines'
network = true

[[capability.provider.operation]]
name = 'Full Port Range'
args = ['-host', '{target}', '-p', '-', '-silent', '-rate', '{rate}']
output = 'lines'
network = true

[[capability.provider.operation]]
name = 'Top 1000 Ports'
args = ['-host', '{target}', '-top-ports', '1000', '-silent', '-rate', '{rate}']
output = 'lines'
network = true

[[capability.provider.operation]]
name = 'TCP Verified'
args = ['-host', '{target}', '-top-ports', '100', '-verify', '-silent']
output = 'lines'
network = true
[[capability.provider]]
binary = 'masscan'
[[capability.provider.operation]]
name = 'Full Range Blast'
args = ['{target}', '-p', '1-65535', '--rate', '100000', '--open']
output = 'lines'
network = true

[[capability.provider.operation]]
name = 'Web Ports Blast'
args = ['{target}', '-p', '80,443,8080,8443', '--rate', '100000']
output = 'lines'
network = true
[[capability.provider]]
binary = 'rustscan'
[[capability.provider.operation]]
name = 'Adaptive Scan'
args = ['-a', '{target}', '--ulimit', '5000', '-b', '4500']
output = 'lines'
network = true

[[capability]]
id = 'surface.service-fingerprint'
phase = 'surface'
label = 'SERVICE FINGERPRINT'
summary = 'Identify the service and version behind each open port'
