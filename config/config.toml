version = 0

[general]
output_dir = "/home/iturn/tsec/output"
log_dir = "/home/iturn/tsec/logs"
preview_lines = 500
color = "auto"
keep_raw = true

[execution]
max_concurrency = 6
# Generous by default. A capability still producing results has not failed, and
# the framework cannot tell that apart from one that has hung.
timeout_secs = 1800
oniux_binary = "oniux"
kill_grace_ms = 2000
group_kill_grace_ms = 500

# Per-binary budgets, for tools whose normal job outlives the default. These are
# the tools that fan out across many hosts or query many sites, so they are slow
# for as long as they are working.
[execution.tool_timeout_secs]
# Local readers. A directory handed to a single-file tool makes it walk, so
# these are kept short: the work is a read, not a scan.
file = 120
exiftool = 180
strings = 120
mat2 = 120
pdfinfo = 120
exiv2 = 120
mediainfo = 180
binwalk = 600
stat = 60
sha256sum = 60
jq = 60
